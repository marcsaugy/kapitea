<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Kapitea — image de partage</title>
<!-- Gabarit de l'image Open Graph, rendu en PNG par tools/build-og.js.

     Il charge css/base.css : la vignette lit les mêmes jetons que le site.
     C'est tout l'intérêt d'en faire un gabarit versionné plutôt qu'un PNG
     produit à la main — la dernière version avait gardé les gris bleutés
     et l'ancien mark six mois après que les deux aient changé. -->
<link rel="stylesheet" href="../css/base.css">
<style>
  html, body { margin: 0; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background-color: var(--paper);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 84px;
    box-sizing: border-box;
  }

  /* Pas de grain ici, contrairement au site. Du bruit aléatoire ne se
     compresse pas : mesuré, il ajoutait 96 Ko à un PNG qui en fait 288,
     et à la taille d'une vignette de partage il est invisible. */

  /* Le même motif que le hero, à la place du dégradé d'ambiance qu'il y
     avait ici : c'est le seul geste graphique de la marque.

     Le débord est à gauche, pas à droite : la montée occupe le dernier
     tiers du tracé, et avec un débord à droite elle sortait du cadre —
     il ne restait qu'un trait dans le coin. */
  .curve {
    position: absolute;
    left: -8%;
    bottom: -5%;
    width: 108%;
    color: var(--brique);
    opacity: 0.16;
  }

  .curve-area { fill: var(--brique); stroke: none; opacity: 0.28; }

  .lockup {
    position: absolute;
    top: 56px;
    left: 84px;
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--brique);
  }

  .lockup svg { width: 58px; height: auto; }

  .lockup span {
    font-family: var(--font-family);
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.03em;
  }

  .content { position: relative; z-index: 1; }

  h1 {
    font-family: var(--font-family);
    font-size: 62px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: var(--display-track);
    color: var(--ink);
    margin: 0 0 26px;
    max-width: 15em;
  }

  p {
    font-family: var(--font-family);
    font-size: 27px;
    line-height: 1.45;
    color: var(--ink-2);
    margin: 0 0 40px;
    max-width: 30em;
  }

  .badges { display: flex; gap: 14px; }

  .badge {
    font-family: var(--font-family);
    font-size: 20px;
    font-weight: 550;
    color: var(--brique);
    background-color: var(--brique-wash);
    border: 1px solid var(--line-2);
    border-radius: var(--r-input);
    padding: 13px 22px;
  }
</style>
</head>
<body>

    <svg class="curve" viewBox="0 0 1200 300" fill="none" aria-hidden="true">
      <path class="curve-area" d="M0 296C380 295 640 284 820 230C980 182 1130 100 1200 4L1200 300L0 300Z"/>
      <path d="M0 296C380 295 640 284 820 230C980 182 1130 100 1200 4"

      </svg>
      <span>Kapitea</span>
    </div>

    <div class="content">
      <h1>Un capital important à placer&#8239;? Prenons le temps d'y voir clair.</h1>
      <p>Retraite, héritage, vente immobilière ou cession d'entreprise&#8239;: les décisions qui comptent méritent d'être prises sans précipitation.</p>
